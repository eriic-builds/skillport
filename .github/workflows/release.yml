name: Minimal runtime artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/package-runtime.mjs
      - run: node scripts/verify-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: skillport-runtime
          path: dist-runtime/
